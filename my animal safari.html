<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body { position: relative; }
.safari-slide { height: 200px; text-align: center; padding-top: 75px; font-size: 1.8rem; color: white; }
.slide-forest { background-color: #4CAF50; }
.slide-ocean { background-color: #2196F3; }
.slide-desert { background-color: #FF9800; }
.section { padding: 70px 20px; min-height: 300px; }
#forest { background-color: honeydew; }
#ocean { background-color: lightcyan; }
#desert { background-color: lightyellow; }
    </style>
</head>

<body data-spy="scroll" data-target="#safariNav" data-offset="60">

<div id="safariCarousel" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators">
        <li data-target="#safariCarousel" data-slide-to="0" class="active"></li>
        <li data-target="#safariCarousel" data-slide-to="1"></li>
        <li data-target="#safariCarousel" data-slide-to="2"></li>
    </ol>
    <div class="carousel-inner">
        <div class="carousel-item active safari-slide slide-forest">
            Forest Safari
        </div>
        <div class="carousel-item safari-slide slide-ocean">
            Ocean Safari
        </div>
        <div class="carousel-item safari-slide slide-forest"> Forest Safari</div>
    </div>
</body>
</html>
